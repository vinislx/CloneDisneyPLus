<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Disney+</title>
    <link rel="stylesheet" href="./dist/styles/mian.css">
</head>
<body>

                <img src="./dist/images/disneyplus.svg" alt="logo Disney Plus">

            <h3 class="title__small">As melhores histórias em um só lugar.</h3>
            <p class="text__small">
                <a href="#" class="link-text">Assine já</a>

                e aproveite o melhor do entretenimento
            </p>
            <ul class="hero__content__combos">
                <li class="hero__content__combos__combo"> <img src="./dist/images/logos/disney_star_plus.png" alt="disney_plus + star_plus">
                <button>Assina já</button>
                <span>R$ 45,90/mês*</span>
                </li>
                <li class="hero__content__combos__combo"> <img src="./dist/images/logos/disney_star_plus_starzplay.png" alt="disney_plus + star_plus + starzplay">
                <button>Assina já</button>

                Economize 30% nos planos anuais do Disney+ e pague em 12 parcelas mensais
            </p>
